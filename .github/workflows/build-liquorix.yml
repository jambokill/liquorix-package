# File: .github/workflows/build-liquorix-test.yml

name: Build Liquorix Kernel (Test Only)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    env:
      DEB_BUILD_DIR: ${{ github.workspace }}/deb_build

    steps:
      # 1. Checkout the repository (current repo)
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install build dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential fakeroot dpkg-dev libncurses-dev bison flex \
            libssl-dev bc libelf-dev cpio git kernel-package

      # 3. Prepare artifact folder
      - name: Prepare build folder
        run: mkdir -p $DEB_BUILD_DIR

      # 4. Build Debian packages exactly as source defines
      - name: Build Debian packages
        run: |
          cd linux-liquorix
          fakeroot debian/rules clean
          fakeroot debian/rules binary-headers binary-generic

      # 5. Collect the resulting .deb packages
      - name: Collect .deb artifacts
        run: |
          mkdir -p $DEB_BUILD_DIR
          mv linux-*.deb $DEB_BUILD_DIR/ || true
          mv ../linux-*.deb $DEB_BUILD_DIR/ || true

      # 6. Upload artifacts
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquorix-kernel
          path: $DEB_BUILD_DIR/
