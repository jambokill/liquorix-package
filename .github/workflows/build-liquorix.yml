name: Build Liquorix Kernel (Docker Test Build)

on:
  workflow_dispatch:   # manual trigger
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Docker and GnuPG
      - name: Install Docker and GnuPG
        run: |
          sudo apt update
          sudo apt install -y docker.io gnupg

      # 3. Make Liquorix scripts executable
      - name: Make scripts executable
        run: chmod +x scripts/debian/*.sh

      # 4. Disable signing in scripts for first test build
      - name: Disable dpkg signing
        run: |
          find scripts/debian/ -type f -exec sed -i 's/dpkg-buildpackage /dpkg-buildpackage --no-sign /g' {} \;

      # 5. Bootstrap Docker images
      - name: Bootstrap Docker images
        run: ./scripts/debian/docker_bootstrap.sh

      # 6. Build source package
      - name: Build source package
        run: ./scripts/debian/docker_build-source.sh debian bookworm

      # 7. Build binary package
      - name: Build binary package
        run: ./scripts/debian/docker_build-binary.sh amd64 debian bookworm

      # 8. List built artifacts
      - name: List artifacts
        run: ls -l artifacts/debian/bookworm

      # 9. Upload built .deb packages
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: liquorix-deb
          path: artifacts/debian/bookworm/*.deb
